<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#F8F7F4" rx="16"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#FFFFFF" stroke="#EAE8E2" stroke-width="2"/>
  <text x="70" y="80" font-family="sans-serif" font-size="18" font-weight="700" fill="#343630">Classification Diagnostics: ROC &amp; Precision-Recall</text>
  
  <g transform="translate(70, 130)">
    <!-- Sub-chart 1 -->
    <rect width="400" height="350" rx="10" fill="#FAFAF8" stroke="#EAE8E2"/>
    <text x="25" y="35" font-family="sans-serif" font-size="14" font-weight="700" fill="#343630">ROC Curve (Sensitivity vs 1-Specificity)</text>
    <line x1="50" y1="280" x2="350" y2="280" stroke="#77766F"/>
    <line x1="50" y1="280" x2="50" y2="70" stroke="#77766F"/>
    <path d="M50,280 Q80,80 350,70" fill="none" stroke="#343630" stroke-width="3"/>
    <text x="180" y="160" font-family="sans-serif" font-size="12" font-weight="700" fill="#343630">AUC = 0.852</text>

    <!-- Sub-chart 2 -->
    <g transform="translate(430, 0)">
      <rect width="400" height="350" rx="10" fill="#FAFAF8" stroke="#EAE8E2"/>
      <text x="25" y="35" font-family="sans-serif" font-size="14" font-weight="700" fill="#343630">Confusion Matrix at 0.22 Risk Cutoff</text>
      <!-- Matrix grid -->
      <rect x="60" y="80" width="130" height="90" fill="#DCE5DD" rx="6"/>
      <text x="125" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#343630">TN: 93,240</text>
      <text x="125" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#77766F">Approved Good</text>

      <rect x="200" y="80" width="130" height="90" fill="#FEE2E2" rx="6"/>
      <text x="265" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#B91C1C">FP: 12,320</text>
      <text x="265" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B91C1C">Declined Good</text>

      <rect x="60" y="180" width="130" height="90" fill="#FEE2E2" rx="6"/>
      <text x="125" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#B91C1C">FN: 2,040</text>
      <text x="125" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B91C1C">Missed Default</text>

      <rect x="200" y="180" width="130" height="90" fill="#DCE5DD" rx="6"/>
      <text x="265" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#047857">TP: 7,400</text>
      <text x="265" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#047857">Caught Default (78%)</text>
    </g>
  </g>
</svg>
