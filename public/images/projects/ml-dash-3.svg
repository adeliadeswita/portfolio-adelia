<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#F8F7F4" rx="16"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#FFFFFF" stroke="#EAE8E2" stroke-width="2"/>
  <text x="70" y="80" font-family="sans-serif" font-size="18" font-weight="700" fill="#343630">Cost-Matrix Expected Loss Minimization Curve</text>
  
  <g transform="translate(100, 130)">
    <line x1="60" y1="320" x2="740" y2="320" stroke="#343630" stroke-width="2"/>
    <line x1="60" y1="320" x2="60" y2="60" stroke="#343630" stroke-width="2"/>

    <!-- Cost Curve U-Shape -->
    <path d="M70,80 C180,310 320,310 700,70" fill="none" stroke="#343630" stroke-width="4"/>
    <circle cx="280" cy="275" r="8" fill="#10B981"/>
    <text x="295" y="275" font-family="sans-serif" font-size="13" font-weight="700" fill="#10B981">Optimal Cutoff Threshold: p = 0.22</text>
    <text x="295" y="295" font-family="sans-serif" font-size="11" fill="#77766F">Net portfolio profit maximized at IDR 14.2B</text>

    <!-- X labels -->
    <text x="70" y="345" font-family="sans-serif" font-size="12" fill="#77766F">0.05 (Overly strict)</text>
    <text x="280" y="345" font-family="sans-serif" font-size="12" font-weight="700" fill="#343630">0.22 (Calibrated)</text>
    <text x="500" y="345" font-family="sans-serif" font-size="12" fill="#77766F">0.50 (Default naive)</text>
    <text x="680" y="345" font-family="sans-serif" font-size="12" fill="#77766F">0.80 (Excessive NPL)</text>
  </g>
</svg>
