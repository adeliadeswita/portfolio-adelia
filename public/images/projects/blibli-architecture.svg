<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#F8F7F4" rx="16"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#FFFFFF" stroke="#EAE8E2" stroke-width="2"/>
  <text x="70" y="80" font-family="sans-serif" font-size="18" font-weight="700" fill="#343630">Data Architecture: Kimball Star-Schema Mart (BigQuery)</text>
  
  <!-- Fact Table -->
  <g transform="translate(360, 200)">
    <rect width="280" height="230" rx="10" fill="#343630"/>
    <rect width="280" height="38" rx="10" fill="#242621"/>
    <text x="140" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">fct_live_session_orders</text>
    <text x="20" y="65" font-family="monospace" font-size="12" fill="#DCE5DD">PK: order_item_id</text>
    <text x="20" y="90" font-family="monospace" font-size="12" fill="#FFFFFF">FK: session_id</text>
    <text x="20" y="115" font-family="monospace" font-size="12" fill="#FFFFFF">FK: merchant_id</text>
    <text x="20" y="140" font-family="monospace" font-size="12" fill="#FFFFFF">FK: product_id</text>
    <text x="20" y="165" font-family="monospace" font-size="12" fill="#FFFFFF">FK: streamer_id</text>
    <text x="20" y="190" font-family="monospace" font-size="12" fill="#E8A782">metric: gmv_amount</text>
    <text x="20" y="215" font-family="monospace" font-size="12" fill="#E8A782">metric: voucher_subsidy</text>
  </g>

  <!-- Dimension 1: Streamer -->
  <g transform="translate(80, 100)">
    <rect width="210" height="130" rx="8" fill="#F4F2ED" stroke="#DCE5DD"/>
    <rect width="210" height="30" rx="8" fill="#DCE5DD"/>
    <text x="105" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#343630">dim_streamers</text>
    <text x="15" y="55" font-family="monospace" font-size="11" fill="#343630">PK: streamer_id</text>
    <text x="15" y="78" font-family="monospace" font-size="11" fill="#77766F">name, tier, agency</text>
    <text x="15" y="102" font-family="monospace" font-size="11" fill="#77766F">base_fee_per_hour</text>
  </g>

  <!-- Dimension 2: Sessions -->
  <g transform="translate(80, 320)">
    <rect width="210" height="130" rx="8" fill="#F4F2ED" stroke="#DCE5DD"/>
    <rect width="210" height="30" rx="8" fill="#DCE5DD"/>
    <text x="105" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#343630">dim_sessions</text>
    <text x="15" y="55" font-family="monospace" font-size="11" fill="#343630">PK: session_id</text>
    <text x="15" y="78" font-family="monospace" font-size="11" fill="#77766F">stream_start_time</text>
    <text x="15" y="102" font-family="monospace" font-size="11" fill="#77766F">campaign_tag</text>
  </g>

  <!-- Dimension 3: Products -->
  <g transform="translate(710, 100)">
    <rect width="210" height="130" rx="8" fill="#F4F2ED" stroke="#DCE5DD"/>
    <rect width="210" height="30" rx="8" fill="#DCE5DD"/>
    <text x="105" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#343630">dim_products</text>
    <text x="15" y="55" font-family="monospace" font-size="11" fill="#343630">PK: product_id</text>
    <text x="15" y="78" font-family="monospace" font-size="11" fill="#77766F">title, category_id</text>
    <text x="15" y="102" font-family="monospace" font-size="11" fill="#77766F">base_price, margin</text>
  </g>

  <!-- Dimension 4: Vouchers -->
  <g transform="translate(710, 320)">
    <rect width="210" height="130" rx="8" fill="#F4F2ED" stroke="#DCE5DD"/>
    <rect width="210" height="30" rx="8" fill="#DCE5DD"/>
    <text x="105" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#343630">dim_vouchers</text>
    <text x="15" y="55" font-family="monospace" font-size="11" fill="#343630">PK: voucher_id</text>
    <text x="15" y="78" font-family="monospace" font-size="11" fill="#77766F">discount_type</text>
    <text x="15" y="102" font-family="monospace" font-size="11" fill="#77766F">sponsor (Blibli/Merchant)</text>
  </g>

  <!-- Connector Lines -->
  <line x1="290" y1="165" x2="360" y2="250" stroke="#77766F" stroke-width="2" stroke-dasharray="4"/>
  <line x1="290" y1="385" x2="360" y2="350" stroke="#77766F" stroke-width="2" stroke-dasharray="4"/>
  <line x1="710" y1="165" x2="640" y2="250" stroke="#77766F" stroke-width="2" stroke-dasharray="4"/>
  <line x1="710" y1="385" x2="640" y2="350" stroke="#77766F" stroke-width="2" stroke-dasharray="4"/>
</svg>
