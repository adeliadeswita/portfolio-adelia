<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#F8F7F4" rx="16"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#FFFFFF" stroke="#EAE8E2" stroke-width="2"/>
  <text x="70" y="80" font-family="sans-serif" font-size="18" font-weight="700" fill="#343630">Fee Elasticity Simulation &amp; Demand Retention Curves</text>
  
  <g transform="translate(100, 130)">
    <line x1="50" y1="340" x2="750" y2="340" stroke="#343630" stroke-width="2"/>
    <line x1="50" y1="340" x2="50" y2="50" stroke="#343630" stroke-width="2"/>

    <!-- Y labels -->
    <text x="35" y="60" text-anchor="end" font-family="sans-serif" font-size="12" fill="#77766F">100%</text>
    <text x="35" y="130" text-anchor="end" font-family="sans-serif" font-size="12" fill="#77766F">95%</text>
    <text x="35" y="200" text-anchor="end" font-family="sans-serif" font-size="12" fill="#77766F">90%</text>
    <text x="35" y="270" text-anchor="end" font-family="sans-serif" font-size="12" fill="#77766F">85%</text>

    <!-- Curve 1: Utility Bills (Inelastic / Resilient) -->
    <path d="M50,60 C250,70 500,95 720,140" fill="none" stroke="#10B981" stroke-width="4"/>
    <text x="730" y="145" font-family="sans-serif" font-size="12" font-weight="700" fill="#10B981">Electricity &amp; Water (High Inelasticity)</text>

    <!-- Curve 2: Pulsa (Elastic) -->
    <path d="M50,60 C200,90 400,200 720,310" fill="none" stroke="#EF4444" stroke-width="4"/>
    <text x="730" y="315" font-family="sans-serif" font-size="12" font-weight="700" fill="#EF4444">Cellular Pulsa (Highly Elastic)</text>

    <!-- X labels -->
    <text x="50" y="365" font-family="sans-serif" font-size="12" fill="#77766F">Base Fee</text>
    <text x="250" y="365" font-family="sans-serif" font-size="12" fill="#77766F">+15 bps</text>
    <text x="450" y="365" font-family="sans-serif" font-size="12" fill="#77766F">+35 bps (Sweet spot)</text>
    <text x="650" y="365" font-family="sans-serif" font-size="12" fill="#77766F">+60 bps</text>
  </g>
</svg>
