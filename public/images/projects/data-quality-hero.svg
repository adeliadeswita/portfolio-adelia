<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F6F4" />
      <stop offset="100%" stop-color="#E2EBE4" />
    </linearGradient>
    <linearGradient id="dq-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAFBF9" />
    </linearGradient>
    <linearGradient id="dq-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A5B4C" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#dq-bg)" />

  <!-- Grid lines -->
  <g stroke="#D6DFD8" stroke-width="1" opacity="0.6">
    <line x1="60" y1="60" x2="740" y2="60" />
    <line x1="60" y1="120" x2="740" y2="120" />
    <line x1="60" y1="180" x2="740" y2="180" />
    <line x1="60" y1="240" x2="740" y2="240" />
    <line x1="60" y1="300" x2="740" y2="300" />
    <line x1="60" y1="360" x2="740" y2="360" />
    <line x1="60" y1="420" x2="740" y2="420" />
  </g>

  <!-- Main Window -->
  <rect x="70" y="50" width="660" height="400" rx="20" fill="url(#dq-card)" stroke="#D0DCD2" stroke-width="2" />
  
  <!-- Window Header -->
  <path d="M 70 70 Q 70 50 90 50 L 710 50 Q 730 50 730 70 L 730 100 L 70 100 Z" fill="#EAEFEA" />
  <circle cx="100" cy="75" r="6" fill="#F87171" />
  <circle cx="120" cy="75" r="6" fill="#FBBF24" />
  <circle cx="140" cy="75" r="6" fill="#34D399" />
  <text x="170" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#343630">BigQuery SQL Data Quality &amp; Hygiene Suite</text>

  <!-- Status Metric Cards -->
  <rect x="100" y="125" width="160" height="80" rx="14" fill="#FFFFFF" stroke="#E2EBE4" stroke-width="1.5" />
  <text x="115" y="150" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#77766F">TOTAL RECORDS</text>
  <text x="115" y="182" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#343630">1,842,500</text>

  <rect x="280" y="125" width="160" height="80" rx="14" fill="#FFFFFF" stroke="#E2EBE4" stroke-width="1.5" />
  <text x="295" y="150" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#77766F">ANOMALIES RESOLVED</text>
  <text x="295" y="182" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#4A5B4C">99.85%</text>

  <rect x="460" y="125" width="230" height="80" rx="14" fill="#FFFFFF" stroke="#E2EBE4" stroke-width="1.5" />
  <text x="475" y="150" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#77766F">VALIDATION RULE STATUS</text>
  <text x="475" y="182" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#10B981">✓ All 18 Checks Passed</text>

  <!-- Data Table Mockup -->
  <rect x="100" y="225" width="590" height="200" rx="14" fill="#FFFFFF" stroke="#E2EBE4" stroke-width="1.5" />
  <rect x="100" y="225" width="590" height="36" rx="14" fill="#F4F7F4" />
  <text x="120" y="248" font-family="monospace" font-size="11" font-weight="700" fill="#343630">table_name</text>
  <text x="250" y="248" font-family="monospace" font-size="11" font-weight="700" fill="#343630">null_ratio</text>
  <text x="360" y="248" font-family="monospace" font-size="11" font-weight="700" fill="#343630">dup_keys</text>
  <text x="470" y="248" font-family="monospace" font-size="11" font-weight="700" fill="#343630">schema_sync</text>
  <text x="590" y="248" font-family="monospace" font-size="11" font-weight="700" fill="#343630">status</text>

  <!-- Row 1 -->
  <line x1="100" y1="295" x2="690" y2="295" stroke="#EFEFEF" />
  <text x="120" y="282" font-family="monospace" font-size="12" fill="#343630">raw_marketplace_orders</text>
  <text x="250" y="282" font-family="monospace" font-size="12" fill="#10B981">0.00%</text>
  <text x="360" y="282" font-family="monospace" font-size="12" fill="#10B981">0</text>
  <text x="470" y="282" font-family="monospace" font-size="12" fill="#343630">Strict 1.0</text>
  <rect x="585" y="268" width="65" height="20" rx="6" fill="#DCE5DD" />
  <text x="597" y="282" font-family="sans-serif" font-size="11" font-weight="700" fill="#2F3E31">PASS</text>

  <!-- Row 2 -->
  <line x1="100" y1="335" x2="690" y2="335" stroke="#EFEFEF" />
  <text x="120" y="322" font-family="monospace" font-size="12" fill="#343630">dim_customer_master</text>
  <text x="250" y="322" font-family="monospace" font-size="12" fill="#10B981">0.02%</text>
  <text x="360" y="322" font-family="monospace" font-size="12" fill="#10B981">0</text>
  <text x="470" y="322" font-family="monospace" font-size="12" fill="#343630">Standard</text>
  <rect x="585" y="308" width="65" height="20" rx="6" fill="#DCE5DD" />
  <text x="597" y="322" font-family="sans-serif" font-size="11" font-weight="700" fill="#2F3E31">PASS</text>

  <!-- Row 3 -->
  <line x1="100" y1="375" x2="690" y2="375" stroke="#EFEFEF" />
  <text x="120" y="362" font-family="monospace" font-size="12" fill="#343630">fct_payment_settlement</text>
  <text x="250" y="362" font-family="monospace" font-size="12" fill="#10B981">0.00%</text>
  <text x="360" y="362" font-family="monospace" font-size="12" fill="#10B981">0</text>
  <text x="470" y="362" font-family="monospace" font-size="12" fill="#343630">Reconciled</text>
  <rect x="585" y="348" width="65" height="20" rx="6" fill="#DCE5DD" />
  <text x="597" y="362" font-family="sans-serif" font-size="11" font-weight="700" fill="#2F3E31">PASS</text>

  <!-- Row 4 -->
  <text x="120" y="402" font-family="monospace" font-size="12" fill="#343630">stg_catalog_skus</text>
  <text x="250" y="402" font-family="monospace" font-size="12" fill="#10B981">0.00%</text>
  <text x="360" y="402" font-family="monospace" font-size="12" fill="#10B981">0</text>
  <text x="470" y="402" font-family="monospace" font-size="12" fill="#343630">Validated</text>
  <rect x="585" y="388" width="65" height="20" rx="6" fill="#DCE5DD" />
  <text x="597" y="402" font-family="sans-serif" font-size="11" font-weight="700" fill="#2F3E31">PASS</text>
</svg>
