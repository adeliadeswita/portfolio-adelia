<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#F8F7F4" rx="16"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#FFFFFF" stroke="#EAE8E2" stroke-width="2"/>
  <text x="70" y="80" font-family="sans-serif" font-size="18" font-weight="700" fill="#343630">Streamer Conversion Scorecard &amp; Category Efficiency</text>
  
  <!-- Table Header -->
  <g transform="translate(70, 120)">
    <rect width="860" height="40" rx="6" fill="#F4F2ED"/>
    <text x="20" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#77766F">STREAMER PROFILE</text>
    <text x="240" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#77766F">CATEGORY</text>
    <text x="420" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#77766F">AIRTIME (HRS)</text>
    <text x="560" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#77766F">GMV / HOUR</text>
    <text x="720" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#77766F">CONV RATE</text>
  </g>

  <!-- Rows -->
  <g transform="translate(70, 175)">
    <!-- Row 1 -->
    <rect width="860" height="60" rx="8" fill="#FFFFFF" stroke="#F4F2ED"/>
    <circle cx="35" cy="30" r="14" fill="#DCE5DD"/>
    <text x="35" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#343630">S1</text>
    <text x="65" y="35" font-family="sans-serif" font-size="14" font-weight="600" fill="#343630">Creator Alpha (Tech)</text>
    <text x="240" y="35" font-family="sans-serif" font-size="13" fill="#77766F">Electronics &amp; Smart Home</text>
    <text x="420" y="35" font-family="sans-serif" font-size="13" font-weight="600" fill="#343630">24.5 hrs</text>
    <text x="560" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#10B981">IDR 102M</text>
    <text x="720" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#343630">10.4%</text>

    <!-- Row 2 -->
    <g transform="translate(0, 70)">
      <rect width="860" height="60" rx="8" fill="#FFFFFF" stroke="#F4F2ED"/>
      <circle cx="35" cy="30" r="14" fill="#E8E5F0"/>
      <text x="35" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#343630">S2</text>
      <text x="65" y="35" font-family="sans-serif" font-size="14" font-weight="600" fill="#343630">Creator Beta (Beauty)</text>
      <text x="240" y="35" font-family="sans-serif" font-size="13" fill="#77766F">Beauty &amp; Skincare</text>
      <text x="420" y="35" font-family="sans-serif" font-size="13" font-weight="600" fill="#343630">38.0 hrs</text>
      <text x="560" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#10B981">IDR 88M</text>
      <text x="720" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#343630">12.1%</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 140)">
      <rect width="860" height="60" rx="8" fill="#FFFFFF" stroke="#F4F2ED"/>
      <circle cx="35" cy="30" r="14" fill="#EAE8E2"/>
      <text x="35" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#343630">S3</text>
      <text x="65" y="35" font-family="sans-serif" font-size="14" font-weight="600" fill="#343630">Merchant In-House Team</text>
      <text x="240" y="35" font-family="sans-serif" font-size="13" fill="#77766F">Mom &amp; Baby</text>
      <text x="420" y="35" font-family="sans-serif" font-size="13" font-weight="600" fill="#343630">52.0 hrs</text>
      <text x="560" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#343630">IDR 54M</text>
      <text x="720" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#343630">7.8%</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 210)">
      <rect width="860" height="60" rx="8" fill="#FFFFFF" stroke="#F4F2ED"/>
      <circle cx="35" cy="30" r="14" fill="#DCE5DD"/>
      <text x="35" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#343630">S4</text>
      <text x="65" y="35" font-family="sans-serif" font-size="14" font-weight="600" fill="#343630">Fashion Influencer Gamma</text>
      <text x="240" y="35" font-family="sans-serif" font-size="13" fill="#77766F">Apparel &amp; Footwear</text>
      <text x="420" y="35" font-family="sans-serif" font-size="13" font-weight="600" fill="#343630">19.5 hrs</text>
      <text x="560" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#343630">IDR 49M</text>
      <text x="720" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#343630">6.4%</text>
    </g>
  </g>
</svg>
