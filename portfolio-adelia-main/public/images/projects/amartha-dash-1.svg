<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#F8F7F4" rx="16"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#FFFFFF" stroke="#EAE8E2" stroke-width="2"/>
  <text x="70" y="80" font-family="sans-serif" font-size="18" font-weight="700" fill="#343630">Biller Net Contribution Margin Decomposition</text>
  
  <g transform="translate(70, 130)">
    <!-- Waterfall chart representation -->
    <rect x="50" y="50" width="80" height="300" rx="6" fill="#343630"/>
    <text x="90" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#343630">Gross Fee</text>
    <text x="90" y="40" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#343630">100%</text>

    <rect x="200" y="50" width="80" height="140" rx="6" fill="#EF4444"/>
    <text x="240" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#77766F">Switching Cost</text>
    <text x="240" y="40" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#EF4444">-46.5%</text>

    <rect x="350" y="190" width="80" height="80" rx="6" fill="#F59E0B"/>
    <text x="390" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#77766F">Agent Rebate</text>
    <text x="390" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#F59E0B">-26.8%</text>

    <rect x="500" y="270" width="80" height="40" rx="6" fill="#6B7280"/>
    <text x="540" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#77766F">Tax &amp; Gateway</text>
    <text x="540" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#6B7280">-13.2%</text>

    <rect x="650" y="310" width="80" height="40" rx="6" fill="#10B981"/>
    <text x="690" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#10B981">Net Margin</text>
    <text x="690" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#10B981">+13.5%</text>
  </g>
</svg>
