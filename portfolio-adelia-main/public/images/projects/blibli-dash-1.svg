<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#F8F7F4" rx="16"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#FFFFFF" stroke="#EAE8E2" stroke-width="2"/>
  <text x="70" y="80" font-family="sans-serif" font-size="18" font-weight="700" fill="#343630">Executive Overview: Live Commerce Funnel</text>
  
  <!-- Funnel visualization -->
  <g transform="translate(100, 130)">
    <polygon points="0,0 800,0 720,60 80,60" fill="#343630"/>
    <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Total Impressions: 1,420,000 (100%)</text>

    <polygon points="80,75 720,75 640,135 160,135" fill="#4B5563"/>
    <text x="400" y="113" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Live Stream Viewers: 450,200 (31.7%)</text>

    <polygon points="160,150 640,150 560,210 240,210" fill="#A8C4B0"/>
    <text x="400" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#343630">Product Bag Clickers: 104,500 (23.2% of viewers)</text>

    <polygon points="240,225 560,225 480,285 320,285" fill="#DCE5DD"/>
    <text x="400" y="263" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#343630">Add-to-Cart Events: 39,340 (37.6% of clicks)</text>

    <polygon points="320,300 480,300 440,360 360,360" fill="#E8A782"/>
    <text x="400" y="338" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Completed Orders: 18,240 (46.3% checkout conversion)</text>
  </g>
</svg>
