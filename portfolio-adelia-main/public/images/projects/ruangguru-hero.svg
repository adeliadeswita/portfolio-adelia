  <text x="442" y="278" font-family="sans-serif" font-size="11" font-weight="700" fill="#2F3E31">Materi Video</text>

  <rect x="550" y="260" width="140" height="28" rx="8" fill="#EAE8E2" />
  <text x="562" y="278" font-family="sans-serif" font-size="11" font-weight="700" fill="#343630">Penjelasan Guru</text>

  <rect x="430" y="300" width="130" height="28" rx="8" fill="#E8E5F0" />
  <text x="442" y="318" font-family="sans-serif" font-size="11" font-weight="700" fill="#343630">Latihan Soal</text>

  <rect x="570" y="300" width="120" height="28" rx="8" fill="#DCE5DD" />
  <text x="582" y="318" font-family="sans-serif" font-size="11" font-weight="700" fill="#2F3E31">Aplikasi Lancar</text>

