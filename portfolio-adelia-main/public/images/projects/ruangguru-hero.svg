  <text x="442" y="358" font-family="sans-serif" font-size="11" font-weight="700" fill="#4A5B4C">UI Ramah Anak</text>

  <rect x="585" y="340" width="105" height="28" rx="8" fill="#EAE8E2" />
  <text x="597" y="358" font-family="sans-serif" font-size="11" font-weight="700" fill="#343630">Paket Belajar</text>
