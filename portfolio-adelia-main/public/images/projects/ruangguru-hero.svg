      <stop offset="0%" stop-color="#FBFBF9" />
      <stop offset="100%" stop-color="#EBECE7" />
    </linearGradient>
    <linearGradient id="rg-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
