  <!-- Bar 5 Star -->
  <text x="110" y="270" font-family="sans-serif" font-size="11" fill="#77766F">5 ★ (2,410)</text>
  <rect x="190" y="258" width="170" height="16" rx="4" fill="#10B981" />

  <!-- Bar 4 Star -->
  <text x="110" y="305" font-family="sans-serif" font-size="11" fill="#77766F">4 ★ (824)</text>
  <rect x="190" y="293" width="75" height="16" rx="4" fill="#34D399" />

  <!-- Bar 3 Star -->
