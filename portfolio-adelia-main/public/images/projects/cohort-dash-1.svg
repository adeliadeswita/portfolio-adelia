<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#F8F7F4" rx="16"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#FFFFFF" stroke="#EAE8E2" stroke-width="2"/>
  <text x="70" y="80" font-family="sans-serif" font-size="18" font-weight="700" fill="#343630">Triangular Cohort Retention Heatmap (Full View)</text>
  
  <g transform="translate(70, 120)">
    <rect width="860" height="400" rx="8" fill="#FAFAF8" stroke="#EAE8E2"/>
    <text x="30" y="40" font-family="sans-serif" font-size="13" font-weight="700" fill="#343630">24-Month Tracking View in Looker Studio</text>
    
    <!-- Visual Heatmap rows -->
    <g transform="translate(30, 70)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="70" height="30" rx="4" fill="#343630"/><text x="35" y="20" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFF">100%</text>
      <rect x="75" y="0" width="70" height="30" rx="4" fill="#A8C4B0"/><text x="110" y="20" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#343630">28.4%</text>
      <rect x="150" y="0" width="70" height="30" rx="4" fill="#DCE5DD"/><text x="185" y="20" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#343630">21.2%</text>
      <rect x="225" y="0" width="70" height="30" rx="4" fill="#DCE5DD"/><text x="260" y="20" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#343630">18.5%</text>
      <rect x="300" y="0" width="70" height="30" rx="4" fill="#EAE8E2"/><text x="335" y="20" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#343630">16.1%</text>
      <rect x="375" y="0" width="70" height="30" rx="4" fill="#EAE8E2"/><text x="410" y="20" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#343630">15.0%</text>

      <!-- Row 2 -->
      <rect x="0" y="40" width="70" height="30" rx="4" fill="#343630"/><text x="35" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFF">100%</text>
      <rect x="75" y="40" width="70" height="30" rx="4" fill="#A8C4B0"/><text x="110" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#343630">26.1%</text>
      <rect x="150" y="40" width="70" height="30" rx="4" fill="#DCE5DD"/><text x="185" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#343630">19.8%</text>
      <rect x="225" y="40" width="70" height="30" rx="4" fill="#EAE8E2"/><text x="260" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#343630">16.4%</text>
      <rect x="300" y="40" width="70" height="30" rx="4" fill="#EAE8E2"/><text x="335" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#343630">14.9%</text>

      <!-- Row 3 -->
      <rect x="0" y="80" width="70" height="30" rx="4" fill="#343630"/><text x="35" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFF">100%</text>
      <rect x="75" y="80" width="70" height="30" rx="4" fill="#A8C4B0"/><text x="110" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#343630">27.5%</text>
      <rect x="150" y="80" width="70" height="30" rx="4" fill="#DCE5DD"/><text x="185" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#343630">20.1%</text>
      <rect x="225" y="80" width="70" height="30" rx="4" fill="#EAE8E2"/><text x="260" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#343630">17.0%</text>

      <!-- Row 4 -->
      <rect x="0" y="120" width="70" height="30" rx="4" fill="#343630"/><text x="35" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFF">100%</text>
      <rect x="75" y="120" width="70" height="30" rx="4" fill="#DCE5DD"/><text x="110" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#343630">22.4%</text>
      <rect x="150" y="120" width="70" height="30" rx="4" fill="#EAE8E2"/><text x="185" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#343630">15.8%</text>
    </g>
  </g>
</svg>
