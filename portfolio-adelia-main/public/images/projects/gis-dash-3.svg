<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#F8F7F4" rx="16"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#FFFFFF" stroke="#EAE8E2" stroke-width="2"/>
  <text x="70" y="80" font-family="sans-serif" font-size="18" font-weight="700" fill="#343630">DBSCAN Spatial Clustering: Natural Density vs Administrative Borders</text>
  
  <g transform="translate(80, 130)">
    <!-- Arbitrary Administrative Border (Dashed Gray) -->
    <path d="M50,180 L350,180 L500,80 L750,80" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-dasharray="8"/>
    <text x="600" y="70" font-family="sans-serif" font-size="11" fill="#9CA3AF">Official District Border (Kecamatan)</text>

    <!-- Cluster Alpha (Crosses Border!) -->
    <ellipse cx="380" cy="180" rx="140" ry="90" fill="#DCE5DD" fill-opacity="0.5" stroke="#10B981" stroke-width="2"/>
    <text x="380" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#047857">Natural Cluster #01 (Cross-border Corridor)</text>

    <!-- Scatter dots -->
    <circle cx="320" cy="160" r="4" fill="#343630"/>
    <circle cx="340" cy="170" r="4" fill="#343630"/>
    <circle cx="360" cy="150" r="4" fill="#343630"/>
    <circle cx="380" cy="190" r="4" fill="#343630"/>
    <circle cx="400" cy="175" r="4" fill="#343630"/>
    <circle cx="420" cy="165" r="4" fill="#343630"/>
    <circle cx="440" cy="200" r="4" fill="#343630"/>
    <circle cx="350" cy="210" r="4" fill="#343630"/>

    <!-- Noise / Outlier dots -->
    <circle cx="150" cy="100" r="4" fill="#9CA3AF"/>
    <circle cx="210" cy="280" r="4" fill="#9CA3AF"/>
    <circle cx="680" cy="240" r="4" fill="#9CA3AF"/>

    <!-- Callout -->
    <g transform="translate(560, 260)">
      <rect width="280" height="80" rx="8" fill="#F8F7F4" stroke="#DCE5DD"/>
      <text x="16" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#343630">Spatial Finding:</text>
      <text x="16" y="50" font-family="sans-serif" font-size="12" fill="#77766F">Evaluating demand along urban corridors</text>
      <text x="16" y="68" font-family="sans-serif" font-size="12" fill="#77766F">captured 42% more address volume.</text>
    </g>
  </g>
</svg>
