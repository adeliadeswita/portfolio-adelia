<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#F8F7F4" rx="16"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#FFFFFF" stroke="#EAE8E2" stroke-width="2"/>
  <text x="70" y="80" font-family="sans-serif" font-size="18" font-weight="700" fill="#343630">Time-to-Second-Purchase (TTSP) Distribution</text>
  
  <g transform="translate(100, 130)">
    <line x1="50" y1="320" x2="750" y2="320" stroke="#EAE8E2" stroke-width="2"/>

    <!-- Histogram bars -->
    <rect x="70" y="220" width="50" height="100" rx="4" fill="#DCE5DD"/>
    <text x="95" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#77766F">12%</text>
    <text x="95" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#77766F">Day 1-7</text>

    <!-- Peak Bar: Day 8-14 -->
    <rect x="150" y="100" width="50" height="220" rx="4" fill="#343630"/>
    <text x="175" y="90" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#343630">38% Peak</text>
    <text x="175" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#77766F">Day 8-14</text>

    <!-- Day 15-21 -->
    <rect x="230" y="160" width="50" height="160" rx="4" fill="#A8C4B0"/>
    <text x="255" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#77766F">23%</text>
    <text x="255" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#77766F">Day 15-21</text>

    <!-- Steep Drop Day 22-30 -->
    <rect x="310" y="260" width="50" height="60" rx="4" fill="#E8A782"/>
    <text x="335" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#EF4444">8%</text>
    <text x="335" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#77766F">Day 22-30</text>

    <!-- Day 31+ -->
    <rect x="390" y="280" width="50" height="40" rx="4" fill="#EAE8E2"/>
    <text x="415" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#77766F">5%</text>
    <text x="415" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#77766F">Day 31+</text>

    <!-- Highlight box -->
    <rect x="60" y="40" width="230" height="40" rx="6" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="175" y="65" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#15803D">73% repurchase in first 21 days</text>
  </g>
</svg>
