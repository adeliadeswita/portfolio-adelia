  <circle cx="685" cy="227" r="4" fill="#10B981" />
  <text x="696" y="231" font-family="monospace" font-size="9.5" font-weight="600" fill="#10B981">
    RUNNING
  </text>

  <!-- Left: 5 Pipeline Steps -->
  <g transform="translate(100, 260)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="105" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="52.5" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94A3B8">INPUT TABLE</text>
    <text x="52.5" y="32" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#F8FAFC">Raw Addresses</text>

    <!-- Arrow 1 -->
    <line x1="107" y1="21" x2="120" y2="21" stroke="#2E6FA0" stroke-width="1.8" marker-end="url(#adira-arrow)" />

    <!-- Stage 2 -->
    <rect x="122" y="0" width="112" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="178" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94A3B8">PREPROCESSING</text>
    <text x="178" y="32" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#F8FAFC">Regex Cleaning</text>

    <!-- Arrow 2 -->
    <line x1="236" y1="21" x2="249" y2="21" stroke="#2E6FA0" stroke-width="1.8" marker-end="url(#adira-arrow)" />

    <!-- Stage 3 -->
    <rect x="251" y="0" width="108" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="305" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94A3B8">BATCH CHUNK</text>
    <text x="305" y="32" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#F8FAFC">Provinsi Split</text>

    <!-- Arrow 3 -->
    <line x1="361" y1="21" x2="374" y2="21" stroke="#2E6FA0" stroke-width="1.8" marker-end="url(#adira-arrow)" />

    <!-- Stage 4 -->
    <rect x="376" y="0" width="112" height="42" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
    <text x="432" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38BDF8">ARCGIS ENGINE</text>
    <text x="432" y="32" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#F8FAFC">RateLimiter (1s)</text>

    <!-- Arrow 4 -->
    <line x1="490" y1="21" x2="503" y2="21" stroke="#2E6FA0" stroke-width="1.8" marker-end="url(#adira-arrow)" />

    <!-- Stage 5 (Master Output in Yellow) -->
    <rect x="505" y="0" width="95" height="42" rx="6" fill="url(#yellow-pill)" stroke="#EAB308" stroke-width="1.2" />
    <text x="552.5" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#713F12">OUTPUT TABLE</text>
    <text x="552.5" y="32" text-anchor="middle" font-family="monospace" font-size="8" font-weight="800" fill="#18181B">TBL_GEOCODING</text>
  </g>

  <!-- Live Record Stream Feed -->
  <g transform="translate(100, 318)" font-family="monospace" font-size="10">
    <rect x="0" y="0" width="600" height="100" rx="8" fill="#090D16" stroke="#1E293B" stroke-width="1" />
    
    <!-- Table Header -->
    <text x="16" y="22" font-weight="700" fill="#64748B">CUST_NO</text>
    <text x="110" y="22" font-weight="700" fill="#64748B">ALAMAT_FULL_TAGIH</text>
    <text x="325" y="22" font-weight="700" fill="#64748B">PROVINSI</text>
    <text x="440" y="22" font-weight="700" fill="#64748B">LAT / LON</text>
    <text x="535" y="22" font-weight="700" fill="#64748B">STATUS</text>

    <line x1="16" y1="30" x2="584" y2="30" stroke="#1E293B" stroke-width="1" />

    <!-- Row 1 -->
    <text x="16" y="48" fill="#F8FAFC">ADR-882104</text>
    <text x="110" y="48" fill="#94A3B8">Jl. Margonda Raya No. 100, Depok</text>
    <text x="325" y="48" fill="#E2E8F0">JAWA BARAT</text>
    <text x="440" y="48" fill="#38BDF8">-6.3728, 106.8317</text>
    <text x="535" y="48" font-weight="700" fill="#10B981">✓ Geocoded</text>

    <!-- Row 2 -->
    <text x="16" y="68" fill="#F8FAFC">ADR-882105</text>
    <text x="110" y="68" fill="#94A3B8">Jl. Sudirman Kav. 25, Setiabudi</text>
    <text x="325" y="68" fill="#E2E8F0">DKI JAKARTA</text>
    <text x="440" y="68" fill="#38BDF8">-6.2088, 106.8456</text>
    <text x="535" y="68" font-weight="700" fill="#10B981">✓ Geocoded</text>

    <!-- Row 3 -->
    <text x="16" y="88" fill="#F8FAFC">ADR-882106</text>
    <text x="110" y="88" fill="#94A3B8">Jl. Pemuda No. 45, Sekayu</text>
    <text x="325" y="88" fill="#E2E8F0">JAWA TENGAH</text>
    <text x="440" y="88" fill="#38BDF8">-6.9744, 110.4208</text>
    <text x="535" y="88" font-weight="700" fill="#10B981">✓ Geocoded</text>
  </g>
</svg>
