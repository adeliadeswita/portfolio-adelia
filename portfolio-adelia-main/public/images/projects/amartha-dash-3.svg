<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#F8F7F4" rx="16"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#FFFFFF" stroke="#EAE8E2" stroke-width="2"/>
  <text x="70" y="80" font-family="sans-serif" font-size="18" font-weight="700" fill="#343630">Payment Gateway Uptime &amp; Timeout Spike Detection</text>
  
  <g transform="translate(70, 130)">
    <!-- Real-time monitoring line chart -->
    <rect width="860" height="360" rx="8" fill="#FAFAF8"/>
    <line x1="40" y1="280" x2="820" y2="280" stroke="#EAE8E2"/>
    <line x1="40" y1="180" x2="820" y2="180" stroke="#EAE8E2"/>
    <line x1="40" y1="80" x2="820" y2="80" stroke="#EAE8E2"/>

    <!-- Gateway A (Healthy) -->
    <path d="M40,90 L180,95 L320,92 L460,94 L600,90 L740,93 L820,91" fill="none" stroke="#10B981" stroke-width="3"/>
    <text x="830" y="95" font-family="sans-serif" font-size="11" font-weight="700" fill="#10B981">Partner A (99.9%)</text>

    <!-- Gateway B (Anomaly Spike Detected) -->
    <path d="M40,100 L180,105 L320,110 L450,115 L500,260 L540,240 L590,120 L740,110 L820,108" fill="none" stroke="#EF4444" stroke-width="3"/>
    <circle cx="500" cy="260" r="7" fill="#EF4444"/>
    <text x="470" y="295" font-family="sans-serif" font-size="12" font-weight="700" fill="#EF4444">Timeout Anomaly 6.8% (Alert Triggered)</text>

    <!-- X Time Marks -->
    <text x="40" y="320" font-family="sans-serif" font-size="11" fill="#77766F">00:00</text>
    <text x="240" y="320" font-family="sans-serif" font-size="11" fill="#77766F">06:00</text>
    <text x="440" y="320" font-family="sans-serif" font-size="11" fill="#77766F">12:00</text>
    <text x="640" y="320" font-family="sans-serif" font-size="11" fill="#77766F">18:00</text>
    <text x="800" y="320" font-family="sans-serif" font-size="11" fill="#77766F">23:59</text>
  </g>
</svg>
