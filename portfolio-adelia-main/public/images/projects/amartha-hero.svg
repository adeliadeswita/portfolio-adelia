<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F8F6"/>
      <stop offset="100%" stop-color="#ECEAE3"/>
    </linearGradient>
    <filter id="ashad" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#343630" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#abg)" rx="20"/>

  <!-- Top bar -->
  <g transform="translate(60, 40)">
    <rect width="1080" height="60" rx="14" fill="#FFFFFF" filter="url(#ashad)"/>
    <text x="36" y="36" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#343630">Amartha Fintech — Payment Unit Economics &amp; PPOB Ledger Analytics</text>
    <rect x="940" y="16" width="100" height="28" rx="8" fill="#E8E5F0"/>
    <text x="965" y="34" font-family="sans-serif" font-size="12" font-weight="600" fill="#343630">● 1.2M TXNs</text>
  </g>

  <!-- KPI row -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="250" height="110" rx="14" fill="#FFFFFF" filter="url(#ashad)"/>
    <text x="24" y="36" font-family="sans-serif" font-size="13" font-weight="600" fill="#77766F">MONTHLY PPOB GMV</text>
    <text x="24" y="74" font-family="sans-serif" font-size="28" font-weight="800" fill="#343630">IDR 48.5B</text>
    <text x="24" y="96" font-family="sans-serif" font-size="12" font-weight="600" fill="#10B981">↑ +18.2% MoM</text>

    <rect x="276" y="0" width="250" height="110" rx="14" fill="#FFFFFF" filter="url(#ashad)"/>
    <text x="300" y="36" font-family="sans-serif" font-size="13" font-weight="600" fill="#77766F">NET CONTRIBUTION MARGIN</text>
    <text x="300" y="74" font-family="sans-serif" font-size="28" font-weight="800" fill="#343630">+3.84%</text>
    <text x="300" y="96" font-family="sans-serif" font-size="12" font-weight="600" fill="#10B981">Restructured fee tiers</text>

    <rect x="552" y="0" width="250" height="110" rx="14" fill="#FFFFFF" filter="url(#ashad)"/>
    <text x="576" y="36" font-family="sans-serif" font-size="13" font-weight="600" fill="#77766F">GATEWAY SUCCESS RATE</text>
    <text x="576" y="74" font-family="sans-serif" font-size="28" font-weight="800" fill="#343630">99.82%</text>
    <text x="576" y="96" font-family="sans-serif" font-size="12" font-weight="600" fill="#10B981">Timeout alerts active</text>

    <rect x="828" y="0" width="252" height="110" rx="14" fill="#FFFFFF" filter="url(#ashad)"/>
    <text x="852" y="36" font-family="sans-serif" font-size="13" font-weight="600" fill="#77766F">SUB-ECONOMIC SKUs</text>
    <text x="852" y="74" font-family="sans-serif" font-size="28" font-weight="800" fill="#E8A782">0 Negative</text>
    <text x="852" y="96" font-family="sans-serif" font-size="12" font-weight="600" fill="#10B981">19 resolved in audit</text>
  </g>

  <!-- Big breakdown chart -->
  <g transform="translate(60, 270)">
    <rect width="680" height="370" rx="16" fill="#FFFFFF" filter="url(#ashad)"/>
    <text x="32" y="44" font-family="sans-serif" font-size="16" font-weight="700" fill="#343630">Biller Category Unit Margin vs Switching Fee Ratio</text>
    <text x="32" y="68" font-family="sans-serif" font-size="13" fill="#77766F">Evaluating PLN, Cellular Pulsa, BPJS, PDAM, and E-Wallet margins</text>

    <line x1="50" y1="300" x2="630" y2="300" stroke="#EAE8E2" stroke-width="2"/>
    <line x1="50" y1="220" x2="630" y2="220" stroke="#F4F2ED" stroke-dasharray="4"/>
    <line x1="50" y1="140" x2="630" y2="140" stroke="#F4F2ED" stroke-dasharray="4"/>

    <!-- Bar groups -->
    <!-- PLN -->
    <rect x="80" y="100" width="40" height="200" rx="6" fill="#343630"/>
    <rect x="125" y="180" width="40" height="120" rx="6" fill="#DCE5DD"/>
    <text x="122" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#77766F">PLN Prepaid</text>

    <!-- Pulsa Data -->
    <rect x="200" y="140" width="40" height="160" rx="6" fill="#343630"/>
    <rect x="245" y="160" width="40" height="140" rx="6" fill="#E8A782"/>
    <text x="242" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#77766F">Pulsa/Data</text>

    <!-- BPJS -->
    <rect x="320" y="160" width="40" height="140" rx="6" fill="#343630"/>
    <rect x="365" y="240" width="40" height="60" rx="6" fill="#DCE5DD"/>
    <text x="362" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#77766F">BPJS Health</text>

    <!-- PDAM -->
    <rect x="440" y="170" width="40" height="130" rx="6" fill="#343630"/>
    <rect x="485" y="250" width="40" height="50" rx="6" fill="#DCE5DD"/>
    <text x="482" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#77766F">PDAM Regional</text>

    <!-- E-Wallet -->
    <rect x="550" y="120" width="40" height="180" rx="6" fill="#343630"/>
    <rect x="595" y="220" width="40" height="80" rx="6" fill="#DCE5DD"/>
    <text x="592" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#77766F">E-Wallet TopUp</text>
  </g>

  <!-- Side info: Elasticity curve -->
  <g transform="translate(770, 270)">
    <rect width="370" height="370" rx="16" fill="#FFFFFF" filter="url(#ashad)"/>
    <text x="32" y="44" font-family="sans-serif" font-size="16" font-weight="700" fill="#343630">Pricing Simulation Curve</text>
    <text x="32" y="68" font-family="sans-serif" font-size="13" fill="#77766F">Transaction volume elasticity model</text>

    <path d="M40,120 Q120,130 200,180 T330,300" fill="none" stroke="#343630" stroke-width="3"/>
    <circle cx="200" cy="180" r="6" fill="#10B981"/>
    <text x="215" y="178" font-family="sans-serif" font-size="12" font-weight="700" fill="#10B981">Optimal Tier (+25 bps)</text>
    
    <g transform="translate(32, 230)">
      <rect width="306" height="90" rx="10" fill="#F8F7F4"/>
      <text x="16" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#343630">Key Analytical Insight:</text>
      <text x="16" y="48" font-family="sans-serif" font-size="12" fill="#77766F">Rural agent retention remains 96.2%</text>
      <text x="16" y="68" font-family="sans-serif" font-size="12" fill="#77766F">stable up to +35 bps fee adjustment.</text>
    </g>
  </g>
</svg>
